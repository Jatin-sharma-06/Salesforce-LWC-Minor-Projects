<template>
    <lightning-card title="Rainbow Season Picker">
        <div class="main">
            <div class="slds-grid">
                <div class="slds-col slds-p-horizontal_medium">
                    <lightning-combobox
                        label="Season"
                        value={season}
                        options={seasonOptions}
                        onchange={handleSeason}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-p-horizontal_medium">
                    <lightning-combobox
                        label="Day Time"
                        value={dayTime}
                        options={dayOptions}
                        onchange={handleDay}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-p-horizontal_medium">
                    <lightning-combobox
                        label="Clock"
                        value={clock}
                        options={clockOptions}
                        onchange={handleClock}>
                    </lightning-combobox>
                </div>  
            </div>
        
            <!-- for prevent overlapping -->
            <div class="blankSpace"></div> 

            <div class={directionClass}>
                <div class="rainbow">
                    <div class={c1}></div>
                    <div class={c2}></div>
                    <div class={c3}></div>
                    <div class={c4}></div>
                    <div class={c5}></div>
                    <div class={c6}></div>
                    <div class="arc arc7"></div>

                </div>
                
            </div>

        </div>

    </lightning-card>

</template>
