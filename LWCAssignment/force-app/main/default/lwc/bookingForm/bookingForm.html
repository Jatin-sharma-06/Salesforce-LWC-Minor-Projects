<template>
    <div class="custom-card">

        <div class="slds-p-around_medium">
            <h2 class="section-title">Booking Form</h2>
            <lightning-input 
                label="Customer Name" 
                name="name" 
                value={formData.name}
                onchange={handleChange}>
            </lightning-input>

            <lightning-input 
                type="date" 
                label="Check-In" 
                name="checkIn" 
                value={formData.checkIn}
                onchange={handleChange}>
            </lightning-input>

            <lightning-input 
                type="date" 
                label="Check-Out" 
                name="checkOut" 
                value={formData.checkOut}
                onchange={handleChange}>
            </lightning-input>

            <lightning-input 
                type="checkbox" 
                label="Extra Services (+₹500)" 
                name="extraServices"
                checked={formData.extraServices}
                onchange={handleChange}>
            </lightning-input>

            <lightning-button 
                label="Book Now"
                variant="brand"
                class="slds-m-top_medium"
                onclick={handleSubmit}>
            </lightning-button>

        </div>
    </div>
</template>
